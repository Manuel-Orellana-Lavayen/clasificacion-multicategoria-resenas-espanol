[workspace]
channels = ["rapidsai",
            "conda-forge"]
name = "Creacion de Modelos"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.10.*"
cuda-version = "==12.9"
cuml = ">=26, <27"
cupy = ">=14.2.0"
